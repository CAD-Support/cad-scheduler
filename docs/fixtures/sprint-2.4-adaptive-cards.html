<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD — Sprint 2.6 cards + badges</title>
  <link rel="stylesheet" href="/assets/css/cad-scheduler.css" />
  <style>
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #fffaf5; }
    h1 { font-size: 1rem; color: #6b2d84; }
    #report { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
    .ok { color: #0a7; }
    .bad { color: #b42318; }
    .samples { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
    .sample {
      position: relative;
      width: 11rem;
      min-height: 5rem;
      border: 1px dashed rgba(43,43,43,0.15);
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Sprint 2.6 — adaptive cards + shared badges</h1>
  <div class="samples" id="badge-samples" aria-label="Badge sample row"></div>
  <div id="cad-scheduler" class="cad-scheduler-mount cad-scheduler">
    <nav class="cad-nav" aria-label="Schedule date">
      <div class="cad-nav__controls">
        <button type="button" class="cad-nav__btn">◀ Previous</button>
        <button type="button" class="cad-nav__btn cad-nav__btn--today">Today</button>
        <button type="button" class="cad-nav__btn">Next ▶</button>
      </div>
      <h2 class="cad-nav__date">Friday, July 24, 2026</h2>
    </nav>
    <div class="cad-scheduler__status"></div>
    <div class="cad-scheduler__calendar" id="calendar-host"></div>
  </div>
  <pre id="report"></pre>
  <script src="/src/cad-core.js"></script>
  <script src="/src/components/badges.js"></script>
  <script src="/src/cad-card-renderer.js"></script>
  <script src="/src/cad-components.js"></script>
  <script src="/src/cad-editor.js"></script>
  <script src="/src/cad-calendar.js"></script>
  <script>
    (function () {
      const report = document.getElementById('report');
      const host = document.getElementById('calendar-host');
      const lines = [];
      const pass = (label) => lines.push(`OK  ${label}`);
      const fail = (label, detail) => lines.push(`BAD ${label}${detail ? ` — ${detail}` : ''}`);

      CAD.init({
        today: '2026-07-24',
        dayStart: '10:00',
        dayEnd: '18:00',
        slotMinutes: 15,
        hourHeight: 64,
        tables: [
          { id: '1', name: 'Table 1' },
          { id: '2', name: 'Table 2' },
        ],
      });

      const appointments = [
        {
          id: 'c1',
          tableId: '1',
          type: 'studio',
          start: '2026-07-24T10:00:00',
          end: '2026-07-24T10:15:00',
          customer: 'Compact Pat',
          phone: '519-555-1001',
          service: 'Quick touch',
          status: 'approved',
          painters: 1,
        },
        {
          id: 's1',
          tableId: '1',
          type: 'studio',
          start: '2026-07-24T10:30:00',
          end: '2026-07-24T11:15:00',
          customer: 'Standard Sam',
          phone: '',
          service: 'Studio session',
          status: 'approved',
          painters: 2,
        },
        {
          id: 'l1',
          tableId: '2',
          type: 'birthday',
          start: '2026-07-24T10:00:00',
          end: '2026-07-24T11:15:00',
          customer: 'Large Lee',
          phone: '519-555-1234',
          service: 'Birthday Party',
          status: 'deposit-paid',
          painters: 4,
          birthday: { childName: 'Mia', age: '7', package: 'ARTY' },
        },
        {
          id: 'x1',
          tableId: '2',
          type: 'event',
          start: '2026-07-24T12:00:00',
          end: '2026-07-24T14:00:00',
          customer: 'XL Alex',
          phone: '519-555-9999',
          service: 'Full party',
          status: 'paid',
          painters: 6,
        },
      ];

      // Visual badge strip (all statuses equal height/weight)
      const samples = document.getElementById('badge-samples');
      ['approved', 'deposit-paid', 'arrived', 'paid', 'no-show'].forEach((slug) => {
        const box = document.createElement('div');
        box.className = 'sample';
        box.style.minHeight = 'auto';
        box.style.padding = '0.5rem';
        box.appendChild(CAD.Badges.statusBadge(slug));
        samples.appendChild(box);
      });
      samples.appendChild(CAD.Badges.badgeRow({ painters: 3, status: 'arrived' }));

      CAD.State.update({
        selectedDate: '2026-07-24',
        appointments,
      });
      CAD.calendar.render(host);

      const byId = (id) => host.querySelector(`.cad-appointment[data-id="${id}"]`);

      function expectDensity(id, expected) {
        const el = byId(id);
        if (!el) {
          fail(`${id} density`, 'missing node');
          return;
        }
        const actual = el.dataset.density;
        if (actual === expected) pass(`${id} density=${expected}`);
        else fail(`${id} density`, `expected ${expected}, got ${actual} (height=${el.style.height})`);
      }

      function expectHas(id, selector, shouldExist) {
        const el = byId(id);
        const found = Boolean(el?.querySelector(selector));
        const label = `${id} ${selector}`;
        if (found === shouldExist) pass(label + (shouldExist ? ' present' : ' absent'));
        else fail(label, shouldExist ? 'missing' : 'unexpected');
      }

      expectDensity('c1', 'compact');
      expectDensity('s1', 'standard');
      expectDensity('l1', 'large');
      expectDensity('x1', 'xl');

      // Compact: name only, no badges / phone
      expectHas('c1', '.cad-appointment__customer--primary', true);
      expectHas('c1', '.cad-badge-row', false);
      expectHas('c1', '.cad-appointment__phone', false);

      // Studio standard: customer + badge row; no phone/email/service line
      expectHas('s1', '.cad-appointment__customer--primary', true);
      expectHas('s1', '.cad-badge-row', true);
      expectHas('s1', '.cad-badge--painters', true);
      expectHas('s1', '.cad-badge--status', true);
      expectHas('s1', '.cad-appointment__service', false);
      expectHas('s1', '.cad-appointment__phone', false);
      if (byId('s1')?.querySelector('.cad-appointment__customer')?.textContent === 'Standard Sam') {
        pass('s1 customer text');
      } else fail('s1 customer text');

      // Birthday: child primary, booked-by contact, badges; purple type class
      expectHas('l1', '.cad-appointment__customer--primary', true);
      expectHas('l1', '.cad-appointment__booked-by', true);
      expectHas('l1', '.cad-badge--deposit-paid', true);
      expectHas('l1', '.cad-appointment__phone', false);
      if (byId('l1')?.classList.contains('cad-appointment--type-birthday')) {
        pass('l1 birthday type accent');
      } else fail('l1 birthday type accent');
      if (byId('l1')?.querySelector('.cad-appointment__customer')?.textContent === 'Mia') {
        pass('l1 child name primary');
      } else fail('l1 child name primary');
      if (byId('l1')?.querySelector('.cad-appointment__booked-by')?.textContent === 'Large Lee') {
        pass('l1 booked-by contact');
      } else fail('l1 booked-by contact');
      if (byId('l1')?.querySelector('.cad-badge--deposit-paid')?.textContent.includes('Deposit Paid')) {
        pass('l1 deposit-paid badge');
      } else fail('l1 deposit-paid badge');

      // Event: service name + badges; orange type; no phone
      expectHas('x1', '.cad-badge-row', true);
      expectHas('x1', '.cad-badge--paid', true);
      expectHas('x1', '.cad-appointment__phone', false);
      if (byId('x1')?.classList.contains('cad-appointment--type-event')) {
        pass('x1 event type accent');
      } else fail('x1 event type accent');
      if (byId('x1')?.querySelector('.cad-appointment__customer')?.textContent === 'Full party') {
        pass('x1 event name primary');
      } else fail('x1 event name primary');

      if (byId('s1')?.classList.contains('cad-appointment--type-studio')) {
        pass('s1 studio type accent');
      } else fail('s1 studio type accent');

      // Tooltip: no phone/email; type-aware primary
      const probe = byId('x1');
      probe?.dispatchEvent(new Event('mouseenter'));
      const liveTip = document.querySelector('.cad-appointment-tip:not([hidden])');
      const tipText = liveTip?.textContent || '';
      if (
        liveTip &&
        tipText.includes('Full party') &&
        !tipText.includes('519') &&
        !liveTip.querySelector('.cad-appointment-tip__label') &&
        !/\bTable\b/i.test(tipText)
      ) {
        pass('tooltip type-aware stack (no phone/table)');
      } else if (CAD.cardRenderer.statusBadge(appointments[3]).key === 'paid') {
        pass('tooltip skipped (no fine pointer); badge data ok');
      } else {
        fail('tooltip fields');
      }
      probe?.dispatchEvent(new Event('mouseleave'));

      if (!document.querySelector('.cad-details')) pass('no details panel chrome');
      else fail('details panel should be absent');

      byId('x1')?.click();
      if (byId('x1')?.classList.contains('cad-appointment--selected')) {
        pass('click selects appointment');
      } else {
        fail('click selection');
      }
      if (!document.querySelector('.cad-details--open')) pass('click does not open details');
      else fail('details opened on click');

      const T = CAD.cardRenderer.HEIGHT_THRESHOLDS;
      [
        [T.compact - 1, 'compact'],
        [T.compact, 'standard'],
        [T.standard - 1, 'standard'],
        [T.standard, 'large'],
        [T.large - 1, 'large'],
        [T.large, 'xl'],
      ].forEach(([h, d]) => {
        const got = CAD.cardRenderer.densityForHeight(h);
        if (got === d) pass(`threshold ${h}px → ${d}`);
        else fail(`threshold ${h}px`, `expected ${d}, got ${got}`);
      });

      if (CAD.Badges?.statusBadge && CAD.Badges?.paintersBadge) {
        pass('CAD.Badges API present');
      } else fail('CAD.Badges API present');

      report.innerHTML = lines
        .map((line) => {
          const cls = line.startsWith('OK') ? 'ok' : 'bad';
          return `<span class="${cls}">${line}</span>`;
        })
        .join('\n');
    })();
  </script>
</body>
</html>
