<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD — WordPress DOM scrollport fixture</title>
  <link rel="stylesheet" href="/assets/css/cad-scheduler.css" />
  <style>
    /* Simulate common WP / Elementor column constraints */
    body { margin: 0; background: #f0ebe3; }
    .elementor-section { display: flex; justify-content: center; padding: 1rem; }
    .elementor-column {
      display: flex;
      flex-direction: column;
      width: min(1100px, 100%);
      min-width: 0;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .elementor-widget-container { min-width: 0; flex: 1 1 auto; }
    h1 { font: 600 0.95rem/1.3 system-ui; margin: 0 0 0.75rem; color: #6b2d84; }
    #report { font: 12px/1.45 ui-monospace, monospace; margin-top: 0.75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="elementor-section">
    <div class="elementor-column">
      <h1>WordPress shortcode DOM — scrollport verification</h1>
      <div class="elementor-widget-container">
        <!-- Exact host from snippets/10A-ajax-bridge.php shortcode + CAD.ui / CAD.calendar -->
        <div id="cad-scheduler" class="cad-scheduler-mount cad-scheduler">
          <nav class="cad-nav" aria-label="Schedule date">
            <div class="cad-nav__controls">
              <button type="button" class="cad-nav__btn">◀ Previous</button>
              <button type="button" class="cad-nav__btn cad-nav__btn--today">Today</button>
              <button type="button" class="cad-nav__btn">Next ▶</button>
            </div>
            <h2 class="cad-nav__date">Friday, July 24, 2026</h2>
            <label class="cad-nav__picker">
              <span class="cad-nav__picker-icon" aria-hidden="true">📅</span>
              <span class="cad-nav__picker-text">Pick Date</span>
              <input type="date" class="cad-nav__date-input" value="2026-07-24" />
            </label>
          </nav>
          <div class="cad-scheduler__status" aria-live="polite"></div>
          <div
            class="cad-scheduler__calendar cad-matrix"
            style="--cad-table-count: 8; --cad-grid-height: 960px; --cad-slot-height: 16px;"
          >
            <div
              class="cad-matrix__scroll"
              id="scroll"
              tabindex="0"
              role="region"
              aria-label="Studio schedule"
              style="--cad-table-count: 8; --cad-grid-height: 960px; --cad-slot-height: 16px;"
            >
              <div class="cad-matrix__head" id="head">
                <div class="cad-matrix__corner" id="corner">2026-07-24</div>
                <div class="cad-matrix__table-label">Table 1</div>
                <div class="cad-matrix__table-label">Table 2</div>
                <div class="cad-matrix__table-label">Table 3</div>
                <div class="cad-matrix__table-label">Table 4</div>
                <div class="cad-matrix__table-label">Table 5</div>
                <div class="cad-matrix__table-label">Table 6</div>
                <div class="cad-matrix__table-label">Table 7</div>
                <div class="cad-matrix__table-label">Table 8</div>
              </div>
              <div class="cad-matrix__body" id="body">
                <div class="cad-matrix__times" id="times"></div>
              </div>
            </div>
          </div>
        </div>
        <pre id="report"></pre>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const times = document.getElementById('times');
      const body = document.getElementById('body');
      const scroll = document.getElementById('scroll');
      const nav = document.querySelector('.cad-nav');
      const corner = document.getElementById('corner');
      const head = document.getElementById('head');
      const report = document.getElementById('report');

      for (let i = 0; i < 60; i++) {
        const slot = document.createElement('div');
        slot.className = 'cad-matrix__time-slot';
        slot.textContent = i % 4 === 0 ? (8 + Math.floor(i / 4)) + ':00' : '';
        times.appendChild(slot);
      }

      for (let t = 0; t < 8; t++) {
        const lane = document.createElement('div');
        lane.className = 'cad-matrix__lane';
        const lines = document.createElement('div');
        lines.className = 'cad-matrix__lines';
        for (let i = 0; i < 60; i++) {
          const line = document.createElement('div');
          line.className = 'cad-matrix__line';
          lines.appendChild(line);
        }
        const blocks = document.createElement('div');
        blocks.className = 'cad-matrix__blocks';
        const appt = document.createElement('button');
        appt.type = 'button';
        appt.className = 'cad-appointment';
        appt.style.top = 40 + t * 70 + 'px';
        appt.style.height = '72px';
        appt.innerHTML = '<span class="cad-appointment__customer">Appt ' + (t + 1) + '</span>';
        blocks.appendChild(appt);
        // Late-day block that must remain reachable via vertical scroll
        if (t === 0) {
          const late = document.createElement('button');
          late.type = 'button';
          late.className = 'cad-appointment';
          late.id = 'late-appt';
          late.style.top = '880px';
          late.style.height = '64px';
          late.innerHTML = '<span class="cad-appointment__customer">Late</span>';
          blocks.appendChild(late);
        }
        lane.append(lines, blocks);
        body.appendChild(lane);
      }

      function measure(label) {
        const cs = getComputedStyle(scroll);
        const sr = scroll.getBoundingClientRect();
        const nr = nav.getBoundingClientRect();
        const cr = corner.getBoundingClientRect();
        const hr = head.getBoundingClientRect();
        const tr = times.getBoundingClientRect();
        const late = document.getElementById('late-appt');
        const lr = late.getBoundingClientRect();
        return {
          label,
          height: cs.height,
          maxHeight: cs.maxHeight,
          overflowX: cs.overflowX,
          overflowY: cs.overflowY,
          scrollTop: scroll.scrollTop,
          scrollLeft: scroll.scrollLeft,
          clientHeight: scroll.clientHeight,
          scrollHeight: scroll.scrollHeight,
          clientWidth: scroll.clientWidth,
          scrollWidth: scroll.scrollWidth,
          hasVerticalScroll: scroll.scrollHeight > scroll.clientHeight + 1,
          hasHorizontalScroll: scroll.scrollWidth > scroll.clientWidth + 1,
          navOutsideScroll: nr.bottom <= sr.top + 1,
          stuck: {
            cornerLeft: Math.abs(cr.left - sr.left) < 2,
            headTop: Math.abs(hr.top - sr.top) < 2,
            timesLeft: Math.abs(tr.left - sr.left) < 2,
          },
          lateVisibleInViewport:
            lr.top >= sr.top - 1 && lr.bottom <= sr.bottom + 1,
          z: {
            corner: getComputedStyle(corner).zIndex,
            head: getComputedStyle(head).zIndex,
            times: getComputedStyle(times).zIndex,
          },
        };
      }

      scroll.scrollTo(0, 0);
      const atTop = measure('top');
      scroll.scrollTo(0, scroll.scrollHeight);
      const atBottom = measure('bottom');
      const lateOk = atBottom.lateVisibleInViewport;
      scroll.scrollTo(180, 120);
      const mid = measure('mid');

      report.textContent = JSON.stringify(
        {
          pass: {
            constrainedHeight: parseFloat(atTop.height) < atTop.scrollHeight,
            verticalScroll: atTop.hasVerticalScroll,
            horizontalScroll: atTop.hasHorizontalScroll || mid.hasHorizontalScroll,
            navFixed: atTop.navOutsideScroll && mid.navOutsideScroll,
            sticky: mid.stuck,
            lateReachable: lateOk,
            zOrder:
              Number(mid.z.corner) > Number(mid.z.head) &&
              Number(mid.z.head) > Number(mid.z.times),
          },
          atTop,
          mid,
          atBottom,
        },
        null,
        2
      );
    })();
  </script>
</body>
</html>
