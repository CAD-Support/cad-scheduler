<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD — Sprint 2.5/2.6 normalized popover</title>
  <link rel="stylesheet" href="/assets/css/cad-scheduler.css" />
  <style>
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #fffaf5; }
    h1 { font-size: 1rem; color: #6b2d84; }
    #report { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
    .ok { color: #0a7; }
    .bad { color: #b42318; }
  </style>
</head>
<body>
  <h1>Sprint 2.5/2.6 — normalized model + ribbon popover + badges</h1>
  <div id="cad-scheduler" class="cad-scheduler-mount cad-scheduler">
    <div class="cad-scheduler__status"></div>
    <div class="cad-scheduler__calendar" id="calendar-host"></div>
  </div>
  <pre id="report"></pre>
  <script src="/src/cad-core.js"></script>
  <script src="/src/cad-api.js"></script>
  <script src="/src/components/badges.js"></script>
  <script src="/src/cad-card-renderer.js"></script>
  <script src="/src/cad-components.js"></script>
  <script src="/src/renderers/helpers.js"></script>
  <script src="/src/renderers/registry.js"></script>
  <script src="/src/renderers/reservation-renderer.js"></script>
  <script src="/src/renderers/birthday-renderer.js"></script>
  <script src="/src/renderers/event-renderer.js"></script>
  <script src="/src/components/status-panel.js"></script>
  <script src="/src/components/popover.js"></script>
  <script src="/src/cad-editor.js"></script>
  <script src="/src/cad-calendar.js"></script>
  <script>
    (function () {
      const report = document.getElementById('report');
      const host = document.getElementById('calendar-host');
      const lines = [];
      const pass = (label) => lines.push(`OK  ${label}`);
      const fail = (label, detail) => lines.push(`BAD ${label}${detail ? ` — ${detail}` : ''}`);

      CAD.init({
        today: '2026-07-27',
        dayStart: '09:00',
        dayEnd: '18:00',
        slotMinutes: 15,
        hourHeight: 64,
        booklyEditUrl: 'https://example.test/wp-admin/admin.php?page=bookly-calendar',
        tables: [
          { id: '1', name: 'Table 1' },
          { id: '2', name: 'Table 2' },
        ],
      });

      const appointments = [
        {
          id: 's1',
          tableId: '1',
          type: 'studio',
          start: '2026-07-27T10:00:00',
          end: '2026-07-27T11:30:00',
          customer: 'Ashley Hamby',
          phone: '519-555-1234',
          service: 'Studio Reservation',
          serviceId: '7',
          status: 'approved',
          painters: 2,
          notes: '',
          birthday: null,
          studio: {},
          event: null,
        },
        {
          id: 'b1',
          tableId: '2',
          type: 'birthday',
          start: '2026-07-27T12:00:00',
          end: '2026-07-27T13:30:00',
          customer: 'Lindsey Mueller',
          phone: '5192679080',
          service: 'Birthday Party',
          serviceId: '42',
          status: 'deposit-paid',
          painters: 8,
          notes: 'Bring cake',
          birthday: {
            childName: 'Emma',
            age: '10',
            package: 'ARTY-Tile Package',
          },
          studio: null,
          event: null,
        },
      ];

      // Frontend must never require raw Bookly IDs on appointments.
      const leaked = JSON.stringify(appointments).match(/79073|84803|76858|json_data|custom_fields/);
      if (!leaked) pass('no raw field IDs / json_data in UI payload');
      else fail('payload leak', String(leaked));

      CAD.State.update({ selectedDate: '2026-07-27', appointments });
      CAD.ui = { root: document.getElementById('cad-scheduler'), calendarEl: host };
      CAD.Popover.init();
      CAD.calendar.render(host);

      const studioBtn = host.querySelector('[data-id="s1"]');
      const bdayBtn = host.querySelector('[data-id="b1"]');
      if (studioBtn && bdayBtn) pass('cards rendered');
      else fail('cards rendered');

      CAD.editor.select('b1');
      const pop = document.querySelector('.cad-popover');
      const bodyText = document.querySelector('.cad-popover__body')?.innerText || '';
      if (pop && !pop.hidden) pass('popover opens on select');
      else fail('popover opens on select');

      if (/Child/i.test(bodyText) && /Emma/.test(bodyText) && /Turning 10/.test(bodyText)) {
        pass('birthday nest rendered by name');
      } else fail('birthday nest rendered by name', bodyText.slice(0, 200));

      if (/ARTY-Tile Package/.test(bodyText)) pass('package rendered');
      else fail('package rendered');

      if (/Booked By/i.test(bodyText) && /Lindsey Mueller/.test(bodyText)) {
        pass('booked by section');
      } else fail('booked by section');

      if (/\(519\) 267-9080/.test(document.querySelector('.cad-popover')?.innerText || '') ||
          /☎ \(519\) 267-9080/.test(document.querySelector('.cad-popover')?.innerText || '')) {
        pass('phone formatted in popover');
      } else fail('phone formatted in popover');

      if (/Painters/i.test(document.querySelector('.cad-popover')?.innerText || '')) {
        pass('painters label');
      } else fail('painters label');

      if (!/79073|Appointment ID|Table 2|json_data/i.test(document.querySelector('.cad-popover')?.innerText || '')) {
        pass('popover omits id/table/raw ids');
      } else fail('popover omits id/table/raw ids');

      // Birthday ribbon + shared status badge
      const bdayRibbon = document.querySelector('.cad-popover__ribbon');
      const bdayRibbonLabel = document.querySelector('.cad-popover__ribbon-label')?.textContent || '';
      if (
        bdayRibbon?.dataset.type === 'birthday' &&
        /Birthday Party/i.test(bdayRibbonLabel)
      ) {
        pass('birthday type ribbon');
      } else fail('birthday type ribbon', bdayRibbonLabel);

      if (document.querySelector('.cad-popover__footer .cad-badge--status')) {
        pass('status uses CAD.Badges chip');
      } else fail('status uses CAD.Badges chip');

      if (/Internal Notes/i.test(document.querySelector('.cad-popover')?.innerText || '') &&
          /Bring cake/.test(document.querySelector('.cad-popover')?.innerText || '')) {
        pass('internal notes when present');
      } else fail('internal notes when present');

      // Studio renderer
      CAD.editor.select('s1');
      const studioBody = document.querySelector('.cad-popover__body')?.innerText || '';
      const studioRibbon = document.querySelector('.cad-popover__ribbon-label')?.textContent || '';
      if (
        /Studio Reservation/i.test(studioRibbon) &&
        document.querySelector('.cad-popover__ribbon')?.dataset.type === 'studio' &&
        !/Turning 10/.test(studioBody) &&
        !/Emma/.test(studioBody)
      ) {
        pass('studio layout for studio type');
      } else fail('studio layout');

      if (!/Internal Notes/i.test(document.querySelector('.cad-popover')?.innerText || '')) {
        pass('empty notes section hidden');
      } else fail('empty notes section hidden');

      if (bdayBtn?.classList.contains('cad-appointment--type-birthday')) {
        pass('birthday type accent class');
      } else fail('birthday type accent class');

      if (studioBtn?.classList.contains('cad-appointment--type-studio')) {
        pass('studio type accent class');
      } else fail('studio type accent class');

      if (
        !studioBtn?.querySelector('.cad-appointment__phone') &&
        studioBtn?.querySelector('.cad-badge-row')
      ) {
        pass('cards omit phone and show badges');
      } else fail('cards omit phone and show badges');

      const panel = document.querySelector('.cad-popover__panel');
      const panelW = panel ? Math.round(panel.getBoundingClientRect().width) : 0;
      if (panelW >= 340 && panelW <= 360) pass(`popover width ${panelW}px`);
      else if (panelW > 0 && panelW <= 360) pass(`popover width ${panelW}px (narrow viewport)`);
      else fail('popover width', String(panelW));

      // ESC closes
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
      if (document.querySelector('.cad-popover')?.hidden) pass('ESC closes popover');
      else fail('ESC closes');

      // Renderer registry keyed by type; unknown → studio fallback
      let called = false;
      const CustomEventRenderer = {
        render() {
          called = true;
          const body = document.createDocumentFragment();
          body.appendChild(document.createTextNode('event-body'));
          return { title: 'Custom Event', body };
        },
      };
      CAD.Renderers.register('event', CustomEventRenderer);
      const view = CAD.Renderers.get('event').render({
        type: 'event',
        customer: 'X',
        start: appointments[0].start,
        end: appointments[0].end,
        painters: 1,
      });
      if (called && view.title === 'Custom Event' && view.body.textContent === 'event-body') {
        pass('custom type register works');
      } else fail('custom type register');

      const fallback = CAD.Renderers.get('unknown-type-xyz');
      if (fallback === CAD.ReservationRenderer || fallback === CAD.Renderers.map.studio) {
        pass('unknown type falls back to studio renderer');
      } else fail('unknown type falls back to studio renderer');

      if (CAD.Renderers.map.studio && CAD.Renderers.map.birthday && CAD.Renderers.map.event) {
        pass('registry keyed by studio/birthday/event');
      } else fail('registry keyed by studio/birthday/event');

      report.innerHTML = lines
        .map((line) => `<span class="${line.startsWith('OK') ? 'ok' : 'bad'}">${line}</span>`)
        .join('\n');
    })();
  </script>
</body>
</html>
